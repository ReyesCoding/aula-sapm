server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite archivos grandes (coincide con el límite de 20MB del backend,
    # ver backend/src/middlewares/upload.middleware.ts) al subir por /api.
    client_max_body_size 20m;

    # API: mismo origen para el navegador (sin CORS), reenviado internamente
    # al contenedor del backend dentro de la red de docker-compose.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (tareas, materiales de materia, adjuntos de mensajes),
    # servidos por el backend vía express.static — mismo motivo que /api.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (necesario para que react-router-dom funcione al refrescar /alguna/ruta).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
